<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ribbonGrad" x1="256" y1="100" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/> <!-- Amber -->
      <stop offset="40%" stop-color="#EC4899"/> <!-- Pink -->
      <stop offset="100%" stop-color="#9333EA"/> <!-- Purple -->
    </linearGradient>
    <linearGradient id="ribbonGradDark" x1="256" y1="100" x2="256" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#BE185D"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <filter id="glow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" result="effect1_foregroundBlur"/>
      <feMerge>
        <feMergeNode in="effect1_foregroundBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#9333EA" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#dropShadow)">
    <!-- Back part of the ribbon (darker) -->
    <path d="M250 280 C260 230, 300 160, 310 120 C315 100, 285 100, 280 120 C250 180, 180 280, 200 340 C210 370, 240 380, 270 370 C260 360, 240 340, 250 280 Z" fill="url(#ribbonGradDark)"/>
    
    <!-- Front part of the ribbon -->
    <path d="M280 120 C250 180, 180 280, 200 340 C220 400, 320 380, 360 350 C380 335, 360 310, 340 320 C290 345, 240 330, 250 280 C260 230, 300 160, 310 120 C315 100, 285 100, 280 120 Z" fill="url(#ribbonGrad)"/>
    
    <!-- Highlight -->
    <path d="M285 125 C255 185, 185 285, 205 345 C215 375, 250 380, 280 365 C270 355, 245 335, 255 285 C265 235, 305 165, 315 125 C318 110, 295 110, 285 125 Z" fill="white" fill-opacity="0.2"/>
  </g>
  
  <!-- Sparkles -->
  <g filter="url(#glow)">
    <path d="M256 50 Q256 80 286 80 Q256 80 256 110 Q256 80 226 80 Q256 80 256 50 Z" fill="#FDE68A"/>
    <path d="M390 170 Q390 190 410 190 Q390 190 390 210 Q390 190 370 190 Q390 190 390 170 Z" fill="#FDE68A"/>
    <path d="M130 230 Q130 245 145 245 Q130 245 130 260 Q130 245 115 245 Q130 245 130 230 Z" fill="#FDE68A"/>
    <path d="M340 80 Q340 90 350 90 Q340 90 340 100 Q340 90 330 90 Q340 90 340 80 Z" fill="#FDE68A"/>
  </g>
</svg>
